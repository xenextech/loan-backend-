name: Deploy to VPS

on:
  push:
    branches: [document_vault]
  workflow_dispatch:

# Never allow two production deployments to overlap.
concurrency:
  group: unnati-api-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /home/deploy/projects/unnati-api

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:vitest

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build


  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts


      - name: Deploy application
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS" \
            'bash -s' -- "$DEPLOY_PATH" "$SHA" <<'REMOTE'

          set -euo pipefail

          deploy_path="$1"
          sha="$2"

          cd "$deploy_path"

          echo "================================"
          echo "Syncing repository"
          echo "================================"

          git fetch origin document_vault
          git reset --hard "$sha"

          # Do NOT run git clean.
          # .env.production is intentionally untracked and lives only on VPS.


          echo "================================"
          echo "Building Docker image"
          echo "================================"

          # Build before touching the currently running API.
          # A build failure leaves the existing container untouched.
          docker compose build api


          echo "================================"
          echo "Applying Prisma migrations"
          echo "================================"

          docker compose --profile tools run --rm migrate


          echo "================================"
          echo "Recreating API container"
          echo "================================"

          docker compose up -d --force-recreate api


          echo "================================"
          echo "Pruning dangling images"
          echo "================================"

          docker image prune -f

          REMOTE


      - name: Verify deployment
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS" \
            'bash -s' <<'REMOTE'

          set -euo pipefail

          DEPLOY_PATH="/home/deploy/projects/unnati-api"

          check() {
            local name="$1"
            local url="$2"

            for i in $(seq 1 15); do
              if curl -fsS --max-time 5 "$url" > /dev/null; then
                echo "${name} healthy after ${i} attempt(s)"
                return 0
              fi

              echo "Waiting for ${name}... (${i}/15)"
              sleep 4
            done

            echo "::error::${name} failed health check"

            cd "$DEPLOY_PATH"
            docker compose logs --tail=100 api || true

            return 1
          }

          check \
            "Unnati API" \
            "http://127.0.0.1:3001/api/v1/health"

          REMOTE