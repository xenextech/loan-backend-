name: Vitest Test Runner

on:
  # main is covered by deploy.yml, which runs the same suite as its first
  # gate — excluded here so pushes to main don't test twice.
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:vitest
